<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
   <style>
    :root {
      --bg: #eef2ec;
      --panel: #f6f8f4;
      --ink: #173a34;
      --muted: #7d8a84;
      --line: #d9e0d9;
      --accent: #d9482b;
      --dark: #1f4a43;
      --card: #fbfcf8;
    }
 
    * { box-sizing: border-box; }
 
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Outfit', system-ui, sans-serif;
    }
 
    /* page content (the waffle top bar is styled in nav.js) */
    .page { max-width: 1100px; margin: 0 auto; padding: 40px 32px; }
    .eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
 
    /* centered "get one card" panel (used to be the sidebar) */
    #Search {
      max-width: 560px; margin: 0 auto 32px; padding: 32px 24px; text-align: center;
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    }
    #Search h1 { font-size: 28px; font-weight: 500; margin: 8px 0 4px; }
    #Search h3 { font-size: 14px; font-weight: 400; color: var(--muted); margin: 0 0 20px; }
    .search-form { display: flex; gap: 8px; }
    .search-form input {
      flex: 1; min-width: 0; height: 44px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: 10px; background: #fff;
      font: inherit; font-size: 14px; color: var(--ink);
    }
    .search-form input:focus, .btn:focus-visible { outline: 2px solid var(--dark); outline-offset: 2px; }
    .btn {
      height: 44px; padding: 0 22px; border-radius: 10px; border: 1px solid var(--line);
      background: #e4ece6; color: var(--ink); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .btn:hover { background: #d8e3db; }
 
    #message { font-size: 12px; color: var(--muted); margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    #message::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    #message:empty { display: none; }
 
    /* results */
    #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { --tint: #e8ece8; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .card-top {
      background: var(--tint); padding: 0 16px; height: 42px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; font-weight: 600;
    }
    .card-top small { font-weight: 400; color: var(--muted); }
    .card-body { padding: 16px 18px 18px; }
    .name-row { display: flex; justify-content: space-between; align-items: baseline; }
    .name-row h3 { margin: 0; font-size: 17px; font-weight: 500; }
    .hp { font-size: 15px; font-weight: 600; }
    .hp small { font-size: 9px; color: var(--muted); font-weight: 500; }
    .types { display: flex; gap: 6px; margin-top: 10px; }
    .type { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: var(--tint); font-weight: 500; }
    #empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 14px; padding: 20px 0; }
 
    /* type colors, if its unkown its grey */
    .grass { --tint: #dcebe1; } .fire { --tint: #fde3cf; } .water { --tint: #d9eef5; }
    .electric, .lightning { --tint: #f8ecc0; } .ghost, .poison, .psychic, .darkness { --tint: #e6dff0; }
    .normal, .colorless { --tint: #efe3d3; } .bug { --tint: #e3ecc8; } .flying { --tint: #dfe6f5; }
    .ground, .rock { --tint: #eadfc9; } .ice { --tint: #d8f0f0; } .fighting { --tint: #f3d9d4; }
    .dragon { --tint: #dcdcf5; } .steel, .metal { --tint: #e0e4e8; } .fairy { --tint: #f7dfea; }
 
    @media (max-width: 1000px) { #grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) {
      .page { padding: 24px 16px; }
      #grid { grid-template-columns: 1fr; }
    }
  </style>
</head>


<body>
 
  <!-- waffle navigation (see nav.js) -->
  <div id="topbar"></div>
  <script src="nav.js"></script>
 
  <main class="page">
 
    <!-- get one card, now in the center -->
    <section id="Search">
      <div class="eyebrow">Pokédex</div>
      <h1>Pokédex!</h1>
      <h3>Search for a Card!</h3>
      <form id="searchForm" class="search-form">
        <input id="oneName" placeholder="e.g. Pikachu" autocomplete="off" aria-label="Card name">
        <button id="SearchBtn" class="btn" type="submit">Search</button>
      </form>
      <div id="message"></div>
    </section>
 
    <div id="grid">
      <p id="empty">Search for a card above to see it here.</p>
    </div>
 
  </main>
 
  <!-- all the helpers  -->
  <script>

 
    
 
    // GET /api/cards/search?name=...  -> matching cards (this endpoint still needs to be built in the backend)
    async function searchCards(name) {
      const response = await fetch('/api/cards/search?name=' + encodeURIComponent(name));
      if (!response.ok) throw new Error('Server error');
      return response.json();
    }
 
    // runs when you press the button or hit Enter
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) { say('Type a card name first.'); return; }
      say('Searching...');
      try {
        const list = await searchCards(name);
        render(list);
        say(list.length
          ? `Found ${list.length} card${list.length === 1 ? '' : 's'}.`
          : `No cards match "${name}".`);
      } catch (err) {
        say('Could not load cards from the server.');
      }
    });
  </script>
 
</body>
</html>
