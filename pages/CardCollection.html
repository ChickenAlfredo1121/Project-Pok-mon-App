  margin-top: 14px;

}
.modal-price small {

  <main class="page">
    <div class="eyebrow">Card Database</div>
    <h1>Card Database</h1>

    <!-- filter bar -->
    <div id="filterbar"></div>

    <!-- results -->
    <div id="grid">
      <p class="placeholder">Pick a filter to see cards.</p>
    </div>
  </main>

  <!-- magnified card popup -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Card preview">
    <div class="modal-box" id="modalBox">
      <button type="button" class="modal-btn" id="modalClose" aria-label="Close">&times;</button>

  <script src="filters.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');
    const modalBox = document.getElementById('modalBox');
    const modalContent = document.getElementById('modalContent');

    let currentCards = [];   // the cards currently on screen
    let openCard = null;     // the card shown in the popup

    function showMessage(text) {
      grid.innerHTML = '';
      const p = document.createElement('p');
      p.className = 'placeholder';
      p.textContent = text;
      grid.appendChild(p);
    }

    // builds an <img>, falls back to the card name if the image can't load
    function cardImage(card, size, fallbackSize) {
      const img = document.createElement('img');
      img.src = card.cardImage + '/' + size + '.webp';
      img.alt = card.cardName;
      img.onerror = function () {
        img.onerror = null;
        if (fallbackSize) {
          img.src = card.cardImage + '/' + fallbackSize + '.webp';
        } else {
          const h = document.createElement('h3');
          h.textContent = card.cardName;
          img.replaceWith(h);
        }
      };
      return img;
    }

    function render(cards) {
      currentCards = cards;
      grid.innerHTML = '';

      if (!cards.length) { showMessage('No cards found.'); return; }

      cards.forEach(function (c, i) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card';
        btn.dataset.index = i;
        btn.setAttribute('aria-label', 'View ' + c.cardName);

        if (c.cardImage) {
          const img = cardImage(c, 'low');
          img.loading = 'lazy';
          btn.appendChild(img);
        } else {
          const h = document.createElement('h3');
          h.textContent = c.cardName;
          btn.appendChild(h);
        }
        grid.appendChild(btn);
        if (c.quantity > 1) {            // change to `c.quantity` to always show the badge
  const q = document.createElement('span');
  q.className = 'qty';
  q.textContent = '×' + c.quantity;
  btn.appendChild(q);
}
      });
    }

    // one listener for every card
    grid.addEventListener('click', function (e) {
      const btn = e.target.closest('.card');
      if (btn) openModal(currentCards[Number(btn.dataset.index)]);
    });

    function openModal(card) {
  openCard = card;
  modalContent.innerHTML = '';
  if (card.cardImage) {
    modalContent.appendChild(cardImage(card, 'high', 'low'));
  } else {
    const h = document.createElement('h3');
    h.textContent = card.cardName;
    modalContent.appendChild(h);
  }

  // price of a single copy, under the card
  const price = document.createElement('div');
  price.className = 'modal-price';
  if (typeof card.priceUsd === 'number') {
    price.innerHTML = '<small>Price per card</small>$' +
      card.priceUsd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  } else {
    price.classList.add('none');
    price.textContent = 'Price unavailable';
  }
  modalContent.appendChild(price);

  modal.classList.add('open');
  document.getElementById('modalClose').focus();
}
    function closeModal() {
      modal.classList.remove('open');
      openCard = null;
    }

    // click outside the box, the X, or Escape closes it
    modal.addEventListener('click', function (e) {
      if (!modalBox.contains(e.target)) closeModal();
    });
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
    });

    // the + button: hook this up to your user collection later
 document.getElementById('modalAdd').addEventListener('click', async function () {
  if (!openCard) return;
  const btn = this;
  try {
    const res = await fetch('/api/user/cards', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cardId: openCard._id })
    });
    if (!res.ok) throw new Error('Add failed');
    const { quantity } = await res.json();

    // brief confirmation on the button
    btn.textContent = '✓';
    btn.title = 'You now own ' + quantity;
    setTimeout(() => { btn.textContent = '+'; }, 900);
  } catch (err) {
    console.error(err);
    btn.textContent = '!';
    setTimeout(() => { btn.textContent = '+'; }, 900);
  }
});

    // runs whenever a filter changes
    // filters = { series, type, name }
    async function onFiltersChanged(filters) {
      const params = new URLSearchParams();
      if (filters.series) params.set('set', filters.series);
      if (filters.type)   params.set('type', filters.type);
      if (filters.name)   params.set('name', filters.name);

      if (!params.toString()) {
        showMessage('Pick a filter to see cards.');
        return;
      }

      try {
        const response = await fetch('/api/cards/search?' + params);
        if (!response.ok) throw new Error('Search failed');
        render(await response.json());
      } catch (err) {
        console.error(err);
        showMessage('Something went wrong.');
      }
    }

    initFilters(onFiltersChanged);
  </script>

</body>
